[project]
name = "oai-utils"
version = "0.1.0"
description = "Plenty of snippets for OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-aiplatform",
    "litellm",
    "openai-agents",
    "pydantic",
    "loguru",
    "openai>=1.99.1",
    "pillow",
    "tqdm",
]

[project.optional-dependencies]
vllm = [
    "torch",
    "vllm",
]
tinker = [
    "tinker>=0.9.0",
    "tinker-cookbook>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
tinker-cookbook = { git = "https://github.com/thinking-machines-lab/tinker-cookbook" }
