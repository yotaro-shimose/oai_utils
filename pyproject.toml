[project]
name = "oai-utils"
version = "0.1.0"
description = "Plenty of snippets for OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-aiplatform",
    "litellm",
    "openai-agents",
    "pydantic",
    "loguru",
    "openai>=1.99.1",
    "pillow>=12.1.0",
    "tqdm",
]

[project.optional-dependencies]
vllm = [
    "torch",
    "vllm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
